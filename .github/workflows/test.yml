name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly full matrix test
  workflow_dispatch:  # Allow manual triggering

jobs:
  # Core tests on strategic matrix
  test-core:
    name: Core Tests (Py${{ matrix.python-version }} - ${{ matrix.library }}-${{ matrix.library-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
        library: ['matplotlib', 'seaborn', 'plotly', 'altair']
        library-version: ['min', 'latest']

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group test --extra ${{ matrix.library }}

      - name: Install minimum library version
        if: matrix.library-version == 'min'
        run: |
          case "${{ matrix.library }}" in
            matplotlib)
              uv pip install "matplotlib>=2.0.0,<3.0.0"
              ;;
            seaborn)
              uv pip install "seaborn>=0.9.0,<0.11.0"
              ;;
            plotly)
              uv pip install "plotly>=4.0.0,<5.0.0"
              ;;
            altair)
              uv pip install "altair>=3.0.0,<4.0.0"
              ;;
          esac

      - name: Display installed versions
        run: |
          echo "Python version:"
          python --version
          echo ""
          echo "Installed packages:"
          uv pip list | grep -E "(matplotlib|seaborn|plotly|altair|pytest)" || true

      - name: Run tests
        run: uv run pytest tests/ -v --cov=sane_figs --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10' && matrix.library == 'matplotlib' && matrix.library-version == 'latest'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Full matrix on additional Python versions (weekly)
  test-full:
    name: Full Matrix Tests (Py${{ matrix.python-version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
        include:
          - python-version: '3.11'
            matplotlib: '3.8.0'
            seaborn: '0.13.0'
            plotly: '5.18.0'
            altair: '5.4.0'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --group test --extra all
          uv pip install "matplotlib==${{ matrix.matplotlib }}"
          uv pip install "seaborn==${{ matrix.seaborn }}"
          uv pip install "plotly==${{ matrix.plotly }}"
          uv pip install "altair==${{ matrix.altair }}"

      - name: Display installed versions
        run: |
          echo "Python version:"
          python --version
          echo ""
          echo "Installed packages:"
          uv pip list | grep -E "(matplotlib|seaborn|plotly|altair|pytest)" || true

      - name: Run tests
        run: uv run pytest tests/ -v --cov=sane_figs --cov-report=term-missing

  # Visual regression tests
  test-visual:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # For git history comparison

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --group test --extra all

      - name: Run visual tests
        run: uv run pytest tests/visual/ --regression -v

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/__diffs__/
          retention-days: 7

  # Linting and type checking
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra all

      - name: Run black
        run: uv run black --check sane_figs tests

      - name: Run ruff
        run: uv run ruff check sane_figs tests

      - name: Run mypy
        run: uv run mypy sane_figs --ignore-missing-imports

  # Test with all libraries on latest Python
  test-all-libraries:
    name: All Libraries (Py3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --group test --extra all

      - name: Run tests
        run: uv run pytest tests/ -v --cov=sane_figs --cov-report=xml --cov-report=term-missing

  # Build and test package
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package
        run: uv build

      - name: Check package
        run: uv tool run twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
