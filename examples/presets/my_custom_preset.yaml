# Example custom preset for sane-figs (new format)
# This preset is optimized for a specific journal's requirements
# It inherits from the "article" base mode and "default" base style

name: "my-journal"

# Mode section: defines figure dimensions and element sizing
mode:
  name: "my-journal-mode"
  base: "article"  # Inherit from article mode
  
  # Override figure size [width, height] in inches
  figure_size: [7.0, 5.0]  # Larger than article's 3.5x2.625
  
  # DPI settings
  dpi: 300  # High resolution for print
  screen_dpi: 100  # On-screen / HTML rendering
  
  # Override font sizes for this journal
  font_sizes:
    title: 16.0  # Larger than article's 9.0
    label: 14.0
    legend: 12.0
    tick: 12.0
    annotation: 12.0
  
  # Override line and marker sizing
  line_width: 2.0  # Thicker lines
  marker_size: 8.0  # Larger markers

# Style section: defines visual appearance
style:
  name: "my-journal-style"
  base: "default"  # Inherit from default style
  
  # Use serif font for journal submission
  font_family: "serif"
  
  # Reference built-in colorway
  colorway:
    name: "nature"
  
  # Watermark settings
  watermark:
    type: "text"
    text: "© 2025 My Lab"
    position: "bottom-right"
    opacity: 0.3
    font_size: 10.0
    font_family: "sans-serif"
    font_weight: "normal"
    font_color: "#000000"
